<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="user.css">
    <title>Stand</title>
</head>

<body>
    <div class="main">
        <h1>Dê seu nome para o stand!</h1>
        <div class="form">
            <input id="nome" class="input" type="text" name="name" placeholder="Digite seu nome" required>

            <select id="dia" class="input" name="category" required>
                <option disabled selected value="">Selecione um dia</option>
            </select>

            <select id="horario" class="input" name="time" disabled required>
                <option value="" disabled selected>Selecione um horário</option>

            </select>
            <button id="enviar" class="button-disabled" type="submit" disabled>Enviar</button>
        </div>
        <script src="js/form_visuals.js"></script>
        <script src="js/user.js"></script>
</body>

</html>
