<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="operador.css">
    <title>Stand</title>
</head>

<body>
    <div class="main">
        <h1 class="title">Gerenciar Solicitações</h1>

        <div class="container">
            <h2>Solicitações</h2>
            <div class="cards-solicitacoes" id="card-solicitacoes-pendentes">
                <p>Solcitações Pendentes:</p>
            </div>
            <div class="cards-solicitacoes" id="card-solicitacoes">
                <p>Solicitações Salvas:</p>
            </div>
        </div>

        <div class="container">
            <h2>Horários</h2>
            <div class="tabelas" id="tabelas">
            </div>
            <button class="button-reset" id="button-reset">Resetar Ocupantes</button>
        </div>

        <div class="form">
            <h1>Editar vagas</h1>
            <select id="dia" class="input" name="category" required>
                <option disabled selected value="">O que você deseja alterar?</option>
                <option value="dia">Dia</option>
                <option value="hora">Horário</option>
            </select>
            <button id="save_changes" class="button-disabled" type="submit" disabled>Salvar Alterações</button>
        </div>
    </div>

    <script src="tabela.js"></script>
    <script src="operador.js"></script>
</body>

</html>
